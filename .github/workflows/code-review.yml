name: Code Review

# Two things were wrong with the previous version of this file, and only one of them was
# about code quality.
#
# 1. **Command injection into a privileged workflow.** It ran on `pull_request_target`
#    -- which carries the repository's write token and its secrets -- checked out the
#    *untrusted* head SHA of the pull request, and then interpolated
#    `${{ steps.changed-files.outputs.all_changed_files }}` straight into a `run:` block.
#    A fork can add a file whose name contains shell metacharacters, and it would have
#    been evaluated by that privileged shell. The analysis job now runs on plain
#    `pull_request` (read-only token, no secrets for forks), and the file list is passed
#    through the environment and read by the tool, never spliced into a command.
#
# 2. It linted with flake8 at `--max-line-length=120`, which is not this project's
#    configuration. Reports that disagree with the gate in ci.yml train people to ignore
#    them. It uses ruff with the repo's own pyproject settings now.
#
# `tj-actions/changed-files` is gone too: `git diff` against the merge base needs no
# third-party action, and that particular one was the subject of a supply-chain
# compromise in which a tag was retargeted to a malicious commit.
#
# This workflow is a *reporter*, not a gate -- ci.yml holds the gates. Its steps are
# allowed to fail without failing the build, which for a PR comment is the correct
# tradeoff, and it is the reason none of them may hold write permissions.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Lint report for changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install analysis tools
        run: pip install "ruff==0.16.4" "radon==6.0.1"

      - name: Collect changed Python files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          # NUL-delimited, so a filename containing a space or a newline cannot split.
          git diff -z --name-only --diff-filter=ACMR \
            "origin/${BASE_REF}...HEAD" -- '*.py' > changed.zero
          count=$(tr -cd '\0' < changed.zero | wc -c)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count changed Python file(s)"
          tr '\0' '\n' < changed.zero

      - name: Analyse
        if: steps.changed.outputs.count != '0'
        run: |
          set -euo pipefail
          {
            echo "## Code Quality Report"
            echo
            echo "### Changed Python files"
            echo
            echo '```'
            tr '\0' '\n' < changed.zero
            echo '```'
            echo
            echo "### ruff (project configuration, the same rules ci.yml gates on)"
            echo
            echo '```'
            # xargs -0 keeps the names as arguments rather than as shell text.
            xargs -0 -r ruff check --no-cache < changed.zero 2>&1 || true
            echo '```'
            echo
            echo "### Cyclomatic complexity and maintainability"
            echo
            echo '```'
            xargs -0 -r radon cc -a -s < changed.zero 2>&1 || true
            echo
            xargs -0 -r radon mi -s < changed.zero 2>&1 || true
            echo '```'
            echo
            echo "---"
            echo "*Reporting only. The gates are in \`ci.yml\`.*"
          } > report.md

          cat report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post review comment
        if: steps.changed.outputs.count != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const marker = '## Code Quality Report';
            let report = fs.readFileSync('report.md', 'utf8');
            if (report.length > 60000) {
              report = report.slice(0, 60000) + '\n\n... (truncated)';
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: report,
              });
            }

  checklist:
    name: PR checklist
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    permissions:
      contents: read
      pull-requests: write
    # No checkout: this job only talks to the API, which is why it is safe for it to
    # hold a write permission.
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = [
              '## PR Checklist',
              '',
              '### Code quality',
              '- [ ] `ruff check .` and `ruff format --check .` pass locally',
              '- [ ] `mypy app/` passes',
              '- [ ] No stray `print()` or debugger statements',
              '- [ ] No secrets, tokens or real credentials in the diff',
              '',
              '### Testing',
              '- [ ] `pytest -q` passes and coverage stays at or above the floor',
              '- [ ] New behaviour has a test that would fail without it',
              '- [ ] Camera-dependent work is marked `@pytest.mark.hardware`',
              '',
              '### Schema and data',
              '- [ ] Model changes ship an Alembic revision (`flask db migrate`)',
              '- [ ] `flask db upgrade` applies to an existing database, not just an empty one',
              '',
              '### Security',
              '- [ ] Mutating routes are behind `@login_required` and keep CSRF protection',
              '- [ ] User input is validated and sanitised',
              '',
              '---',
              '',
              '**PR stats**',
              '',
              '| Metric | Value |',
              '| --- | --- |',
              `| Files changed | ${pr.changed_files} |`,
              `| Additions | +${pr.additions} |`,
              `| Deletions | -${pr.deletions} |`,
              `| Total | ${pr.additions + pr.deletions} |`,
            ].join('\n');

            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body,
            });
